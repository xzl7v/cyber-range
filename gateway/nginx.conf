events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # صفحة الدخول الموحدة للجامعة كصفحة رئيسية
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # توجيه معمل الطالب (محمي بملف htpasswd)
        location /student/ {
            auth_basic "Student Area - Access Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass https://student-node:6901/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_ssl_verify off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # توجيه معمل المشرف / الدكتور (محمي بملف htpasswd)
        location /doctor/ {
            auth_basic "Doctor Management Area - Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass https://doctor-node:6901/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_ssl_verify off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # مسار بث الفيديو الحي WebSocket لكالي
        location /websockify {
            auth_basic "Student Area - Access Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass https://student-node:6901/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_ssl_verify off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # ملفات واجهة Kasm الثابتة
        location /dist/ {
            auth_basic "Student Area - Access Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass https://student-node:6901/dist/;
            proxy_ssl_verify off;
        }
    }
}