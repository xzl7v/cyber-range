events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # صفحة الدخول الموحدة للجامعة كصفحة رئيسية
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # توجيه معمل الطالب
        location /student/ {
            proxy_pass https://student-node:6901/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_ssl_verify off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_set_header Authorization "Basic a2FzbV91c2VyOlN0dWRlbnRTZWN1cmUyMDI2IQ==";
        }

        # توجيه معمل المشرف / الدكتور
        location /doctor/ {
            proxy_pass https://doctor-node:6901/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_ssl_verify off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_set_header Authorization "Basic a2FzbV91c2VyOkRvY3RvclNlY3VyZTIwMjYh";
        }

        # مسار بث الفيديو الحي WebSocket لكالي
        location /websockify {
            proxy_pass https://student-node:6901/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_ssl_verify off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_set_header Authorization "Basic a2FzbV91c2VyOlN0dWRlbnRTZWN1cmUyMDI2IQ==";
        }

        # ملفات واجهة Kasm الثابتة (لحل مشكلة 404 عند تشغيل البث)
        location /dist/ {
            proxy_pass https://student-node:6901/dist/;
            proxy_ssl_verify off;
            proxy_set_header Authorization "Basic a2FzbV91c2VyOlN0dWRlbnRTZWN1cmUyMDI2IQ==";
        }
    }
}
