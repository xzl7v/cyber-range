services:
  range-gateway:
    image: nginx:alpine
    container_name: range-gateway
    ports:
      - "0.0.0.0:8080:80"
      - "3001:3001"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./gateway/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - frontend-net
      - isolated-range
    depends_on:
      - runtime-manager
      - web-app
    restart: unless-stopped

  web-app:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: cyber-range-web-app
    env_file:
      - .env
    environment:
      - PORT=3000
      - CYBER_RANGE_RUNTIME_URL=http://runtime-manager:3001
      - LABS_DATABASE=/data/labs.sqlite
    volumes:
      - labs-data:/data
    depends_on:
      - runtime-manager
    networks:
      - frontend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/me').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  runtime-manager:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    container_name: cyber-range-runtime-manager
    env_file:
      - .env
    environment:
      - PORT=3001
      - DOCKER_SOCKET=/var/run/docker.sock
      - CYBER_RANGE_LAB_DEFINITIONS=/app/lab-definitions.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  frontend-net:
    driver: bridge
  isolated-range:
    driver: bridge
    internal: true

volumes:
  labs-data: