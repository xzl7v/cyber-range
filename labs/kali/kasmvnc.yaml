desktop:
  resolution:
    width: 1152
    height: 648
  allow_resize: false
  pixel_depth: 24

network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: auto
  use_ipv4: true
  use_ipv6: true
  ssl:
    pem_certificate: /etc/kasmvnc/cyberpod.crt
    pem_key: /etc/kasmvnc/cyberpod.key
    require_ssl: true

runtime_configuration:
  allow_client_to_override_kasm_server_settings: false
  allow_override_standard_vnc_server_settings: false
  allow_override_list: []

encoding:
  max_frame_rate: 60
  rect_encoding_mode:
    min_quality: 5
    max_quality: 8
    consider_lossless_quality: 10

logging:
  log_writer_name: all
  log_dest: logfile
  level: 30
